{% set name = "autogluon.timeseries" %}
{% set version = "1.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/autogluon/autogluon/archive/refs/tags/v{{ version }}.tar.gz
  sha256: fb0c0565f3d4b01b357985d825fe4840c650e238179b519f419953937114149c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install ./timeseries -vv --no-deps --no-build-isolation
  number: 0
  script_env:
    - RELEASE=1

requirements:
  host:
    - python {{ python_min }}
    - packaging
    - pip
    - setuptools
  run:
    # See https://pypi.org/pypi/autogluon.timeseries/{{ version }}/json
    - autogluon.features ==1.6.0.dev0
    - chronos-forecasting >=2.3.1,<2.4
    - einops >=0.7,<1
    - huggingface_hub >=1.3,<2.0
    - peft >=0.18.1,<0.20
    - safetensors >=0.4,<1
    - python >={{ python_min }},<3.14
    - autogluon.core ==1.6.0.dev0
    - autogluon.common ==1.6.0.dev0
    - autogluon.tabular ==1.6.0.dev0
    - accelerate >=1.1.0,<2.0
    - orjson >=3.9,<4.dev0
    - tensorboard >=2.9,<3
    - transformers >=5.3,<5.15
    - sentencepiece !=0.1.92,>=0.1.91  # via transformers sentencepiece extras
    - utilsforecast >=0.2.3,<0.2.12
    - joblib >=1.2,<1.7
    - numpy >=1.25.0,<2.6.0
    - scipy >=1.5.4,<1.19
    - pandas >=2.0.0,<2.4.0
    - gluonts >=0.17.0,<0.18.0
    - pytorch >=2.10,<2.14
    - lightning >=2.5.1,<2.7
    - networkx >=3.0,<4
    - statsforecast >=1.7.0,<2.1.2
    - mlforecast >=0.14.0,<0.15.0
    - coreforecast >=0.0.12,<0.0.17
    - fugue >=0.9.0
    - tqdm >=4.38,<5

test:
  imports:
    - autogluon.timeseries
  commands:
    - python -c "from autogluon.timeseries import __version__ as v; from packaging.version import parse; expected = '{{ version }}'; assert parse(v) == parse(expected), f'{v} != {expected}'"
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://pypi.org/project/autogluon.timeseries
  summary: AutoML for Image, Text, and Tabular Data
  description: |
    AutoGluon automates machine learning tasks enabling you to easily achieve strong 
    predictive performance in your applications. With just a few lines of code, you 
    can train and deploy high-accuracy machine learning and deep learning models on 
    image, text, time series, and tabular data.  
  dev_url: https://github.com/autogluon/autogluon/
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - shchur
    - Innixma
    - prateekdesai04
